<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kitty's Klues</title>
<meta name="apple-mobile-web-app-title" content="Kitty's Klues">
<meta name="theme-color" content="#ff8a65">
<link rel="apple-touch-icon" href="https://zfeit110.github.io/kittys-klub/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="https://zfeit110.github.io/kittys-klub/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ff8a65;font:17px/1.5 Nunito,system-ui,sans-serif;color:#3a2a22;padding:20px}
.card{background:#fffaf5;border-radius:28px;padding:28px 22px;max-width:400px;width:100%;text-align:center}
.kitty{width:110px;height:110px}
h1{font-size:30px;margin:6px 0 4px}
p{margin:8px 0;color:#8a7468}
a.btn{display:block;margin-top:18px;background:#e8643e;color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:999px}
#app{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 16px);width:100%;height:calc(100% - env(safe-area-inset-top) - 16px);border:0;background:#fffaf5;display:none}
#splash{display:none}body.inapp #splash{display:flex;position:fixed;inset:0;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bar,#ff8a65);color:#fff;transition:opacity .35s}#splash.gone{opacity:0;pointer-events:none}.skitty{width:132px;height:132px;animation:bob 1.6s ease-in-out infinite}.sname{font:800 28px/1 system-ui,-apple-system,sans-serif;letter-spacing:.01em}.stag{font:600 16px/1.3 system-ui,-apple-system,sans-serif;opacity:.9;max-width:80vw;text-align:center;min-height:1.3em;margin-top:-4px}.sdots{display:flex;gap:8px}.sdots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.35;animation:dot 1.2s infinite}.sdots i:nth-child(2){animation-delay:.2s}.sdots i:nth-child(3){animation-delay:.4s}@keyframes dot{40%{opacity:1;transform:translateY(-4px)}}@keyframes bob{50%{transform:translateY(-6px)}}
body.inapp{background:linear-gradient(var(--bar,#ff8a65) 0 120px,var(--pbg,var(--bar,#ff8a65)) 120px);padding:0}#safe{position:fixed;top:0;height:env(safe-area-inset-top);width:0;visibility:hidden}body.inapp .card{display:none}body.inapp #app{display:block}
ol{text-align:left;margin:16px 0 0;padding-left:22px;color:#3a2a22}
</style>
</head>
<body>
<div id="safe"></div>
<div id="splash" aria-label="Loading Kitty's Klues" role="status"><svg class="skitty" viewBox="70 70 372 380" aria-hidden="true"><defs> <linearGradient id="kbg2" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#ffa385"/> <stop offset="1" stop-color="#ff7752"/> </linearGradient> <radialGradient id="kfur" cx="0.42" cy="0.35" r="0.75"> <stop offset="0" stop-color="#ffffff"/> <stop offset="0.7" stop-color="#fdf8f5"/> <stop offset="1" stop-color="#efe3dc"/> </radialGradient> </defs> <ellipse cx="256" cy="438" rx="150" ry="20" fill="#000" opacity=".13"/> <!-- ears --> <path d="M128 214 L138 98 Q142 76 162 86 L246 150 Z" fill="url(#kfur)" stroke="#efe3dc" stroke-width="4" stroke-linejoin="round"/> <path d="M384 214 L374 98 Q370 76 350 86 L266 150 Z" fill="url(#kfur)" stroke="#efe3dc" stroke-width="4" stroke-linejoin="round"/> <path d="M150 180 L156 118 Q158 106 168 112 L214 150 Z" fill="#ffb3c7"/> <path d="M362 180 L356 118 Q354 106 344 112 L298 150 Z" fill="#ffb3c7"/> <!-- body --> <path d="M256 128 C368 128 426 206 426 300 C426 392 352 434 256 434 C160 434 86 392 86 300 C86 206 144 128 256 128 Z" fill="url(#kfur)"/> <ellipse cx="186" cy="182" rx="44" ry="20" transform="rotate(-24 186 182)" fill="#fff" opacity=".9"/> <!-- paws --> <ellipse cx="200" cy="416" rx="38" ry="22" fill="#fff" stroke="#eadcd4" stroke-width="4"/> <ellipse cx="312" cy="416" rx="38" ry="22" fill="#fff" stroke="#eadcd4" stroke-width="4"/> <!-- cheeks --> <ellipse cx="168" cy="318" rx="26" ry="15" fill="#ffb3c7" opacity=".75"/> <ellipse cx="344" cy="318" rx="26" ry="15" fill="#ffb3c7" opacity=".75"/> <!-- sleepy eyes --> <path d="M178 276 L220 276" fill="none" stroke="#3a2a22" stroke-width="11" stroke-linecap="round"/> <path d="M292 276 L334 276" fill="none" stroke="#3a2a22" stroke-width="11" stroke-linecap="round"/> <!-- nose + mouth --> <path d="M242 298 Q256 290 270 298 Q264 314 256 316 Q248 314 242 298 Z" fill="#ff7fa6"/> <path d="M234 324 Q245 338 256 324 Q267 338 278 324" fill="none" stroke="#3a2a22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/> <!-- whiskers --> <g stroke="#c9b8ae" stroke-width="5" stroke-linecap="round"> <path d="M128 296 L88 288"/><path d="M130 312 L90 318"/> <path d="M384 296 L424 288"/><path d="M382 312 L422 318"/> </g> </svg><div class="sname">Kitty's Klues</div><div class="stag" id="stag"></div><div class="sdots"><i></i><i></i><i></i></div></div>
<div class="card">
  <svg class="kitty" viewBox="70 70 372 380" aria-hidden="true"><defs> <linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#ffa385"/> <stop offset="1" stop-color="#ff7752"/> </linearGradient> <radialGradient id="kfur" cx="0.42" cy="0.35" r="0.75"> <stop offset="0" stop-color="#ffffff"/> <stop offset="0.7" stop-color="#fdf8f5"/> <stop offset="1" stop-color="#efe3dc"/> </radialGradient> </defs> <ellipse cx="256" cy="438" rx="150" ry="20" fill="#000" opacity=".13"/> <!-- ears --> <path d="M128 214 L138 98 Q142 76 162 86 L246 150 Z" fill="url(#kfur)" stroke="#efe3dc" stroke-width="4" stroke-linejoin="round"/> <path d="M384 214 L374 98 Q370 76 350 86 L266 150 Z" fill="url(#kfur)" stroke="#efe3dc" stroke-width="4" stroke-linejoin="round"/> <path d="M150 180 L156 118 Q158 106 168 112 L214 150 Z" fill="#ffb3c7"/> <path d="M362 180 L356 118 Q354 106 344 112 L298 150 Z" fill="#ffb3c7"/> <!-- body --> <path d="M256 128 C368 128 426 206 426 300 C426 392 352 434 256 434 C160 434 86 392 86 300 C86 206 144 128 256 128 Z" fill="url(#kfur)"/> <ellipse cx="186" cy="182" rx="44" ry="20" transform="rotate(-24 186 182)" fill="#fff" opacity=".9"/> <!-- paws --> <ellipse cx="200" cy="416" rx="38" ry="22" fill="#fff" stroke="#eadcd4" stroke-width="4"/> <ellipse cx="312" cy="416" rx="38" ry="22" fill="#fff" stroke="#eadcd4" stroke-width="4"/> <!-- cheeks --> <ellipse cx="168" cy="318" rx="26" ry="15" fill="#ffb3c7" opacity=".75"/> <ellipse cx="344" cy="318" rx="26" ry="15" fill="#ffb3c7" opacity=".75"/> <!-- sleepy eyes --> <path d="M178 276 L220 276" fill="none" stroke="#3a2a22" stroke-width="11" stroke-linecap="round"/> <path d="M292 276 L334 276" fill="none" stroke="#3a2a22" stroke-width="11" stroke-linecap="round"/> <!-- nose + mouth --> <path d="M242 298 Q256 290 270 298 Q264 314 256 316 Q248 314 242 298 Z" fill="#ff7fa6"/> <path d="M234 324 Q245 338 256 324 Q267 338 278 324" fill="none" stroke="#3a2a22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/> <!-- whiskers --> <g stroke="#c9b8ae" stroke-width="5" stroke-linecap="round"> <path d="M128 296 L88 288"/><path d="M130 312 L90 318"/> <path d="M384 296 L424 288"/><path d="M382 312 L422 318"/> </g> </svg>
  <h1>Kitty's Klues</h1>
  <p id="hi"></p>
  <ol>
    <li>Tap the <b>Share</b> button in Safari.</li>
    <li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>
    <li>Open Kitty's Klues from the new kitty icon.</li>
  </ol>
  <a class="btn" id="go" href="#">Open Kitty's Klues</a>
</div>
<iframe id="app" title="Kitty's Klues" allow="clipboard-write"></iframe>
<script>
{
const EXEC='https://script.google.com/macros/s/AKfycbytApRwN4C5oh_7G6H9OYiRe-QAPkjR51-GOqK2S9yE0sttXkgrssrZcbfPHfETJ4MhTQ/exec';
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const q=new URLSearchParams(location.search);
// remember who this is, so the Home Screen copy still knows even if iOS drops the link details
['k','me'].forEach(n=>{if(q.get(n))store.set('kkfd-'+n,q.get(n))});
const fwd=new URLSearchParams();['k','me'].forEach(n=>{const v=q.get(n)||store.get('kkfd-'+n);if(v)fwd.set(n,v)});
const dest=EXEC+(fwd.toString()?'?'+fwd:'');
const me=fwd.get('me');
document.getElementById('go').href=dest;
document.getElementById('hi').textContent=me?'Hi '+me+'! Save me to your Home Screen.':'Save me to your Home Screen.';
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
// paint the strip behind the clock to match the app (the app reports its colour)
const setBar=c=>{if(!/^#[0-9a-f]{6}$/i.test(c||''))return;document.documentElement.style.setProperty('--bar',c);document.querySelector('meta[name=theme-color]').content=c;store.set('kkfd-bar',c)};
setBar(store.get('kkfd-bar'));
const setBg=c=>{if(/^#[0-9a-f]{6}$/i.test(c||'')){document.documentElement.style.setProperty('--pbg',c);store.set('kkfd-bg',c)}};setBg(store.get('kkfd-bg'));
const TAGS=["Warming up the anagrams…","Hiding words in plain sight…","Consulting the cat…","Rearranging letters, please hold","Channeling our inner Angas"];
try{const last=+(store.get('kkfd-tag')||-1);let i=Math.floor(Math.random()*TAGS.length);if(TAGS.length>1&&i===last)i=(i+1)%TAGS.length;document.getElementById('stag').textContent=TAGS[i];store.set('kkfd-tag',String(i))}catch(e){}
const hideSplash=()=>{const s=document.getElementById('splash');if(s&&!s.classList.contains('gone')){s.classList.add('gone');setTimeout(()=>s.remove(),400)}};setTimeout(hideSplash,20000);
/* keep the app's settings here, where iPhone doesn't clear them, and hand them back each launch */
const MK='kkfd-mirror',mget=()=>{try{return JSON.parse(store.get(MK)||'{}')||{}}catch(e){return {}}};let restored=false;
addEventListener('message',e=>{const d=e.data;if(!d||!d.kk)return;
  if(d.kk==='set'&&restored&&typeof d.k==='string'&&/^kk-/.test(d.k)&&d.k.length<60){const M=mget();M[d.k]=String(d.v).slice(0,200000);store.set(MK,JSON.stringify(M))}
  if(d.kk==='bar'){setBar(d.color);setBg(d.bg);if(!restored&&e.source){restored=true;try{e.source.postMessage({kk:'restore',data:mget()},'*')}catch(_){}setTimeout(hideSplash,150)}else hideSplash()}});
if(standalone||q.get('go')==='1'){document.body.classList.add('inapp');document.getElementById('app').src=dest;
  // keep the app inside the visible area: when the iPhone keyboard opens, iOS slides the page up;
  // instead, shrink the app to the space above the keyboard so its top bar never hides under the clock
  const app=document.getElementById('app'),safe=document.getElementById('safe'),vv=window.visualViewport;
  const fit=()=>{const band=(safe.offsetHeight||0)+16,off=vv?vv.offsetTop:0,h=vv?vv.height:innerHeight,full=Math.max(document.documentElement.clientHeight||0,innerHeight);
    if(full-h-off<120){app.style.top='';app.style.height='';app.style.bottom='';}  // no keyboard: normal full-height layout
    else{app.style.top=(off+band)+'px';app.style.height=Math.max(0,h-band)+'px';app.style.bottom='auto'}
    };
  let raf=0;const req=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fit)};
  if(vv){vv.addEventListener('resize',req);vv.addEventListener('scroll',req)}addEventListener('resize',req);addEventListener('orientationchange',req)}
else{q.set('go','1');try{history.replaceState(null,'',location.pathname+'?'+q)}catch(e){}}
}
</script>
</body>
</html>
